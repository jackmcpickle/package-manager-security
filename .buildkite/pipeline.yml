steps:
  - label: ":bun: test + lint + coverage"
    key: ci
    plugins:
      - docker#v5.13.0:
          image: "oven/bun:1.2"
    command:
      - bun install --frozen-lockfile
      - bun test --coverage --coverage-reporter=lcov --coverage-reporter=text
      - bun lint
      - bun run coverage:check
