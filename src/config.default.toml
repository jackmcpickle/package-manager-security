preset = "standard"
ignoreScripts = true
minReleaseAgeDays = 1
requireLockfile = true
requirePmPin = true
auditLevel = "high"
agentic = true
applyAgentic = false

# Optional company or proxy registry. When set, apply writes this URL
# and audit warns if the committed pin differs. Unset: any pin passes;
# apply writes https://registry.npmjs.org/
# registry = "https://registry.npmjs.org/"

# Other presets (uncomment one to use):
# preset = "relaxed"
# preset = "strict"

# Other audit levels:
# auditLevel = "critical"
# auditLevel = "moderate"
# auditLevel = "low"
# auditLevel = "info"

# enabledManagers = ["npm", "pnpm", "yarn", "bun", "uv", "bundler", "cargo", "composer"]

